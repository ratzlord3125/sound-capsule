<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sound Capsule</title>
    <meta name="description" content="A personal recreation of Spotify's Sound Capsule: your top artists, songs, genres, minutes and milestones." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='20' width='48' height='24' rx='12' fill='%231db954'/%3E%3Crect x='8' y='20' width='24' height='24' rx='12' fill='%23ff2d75'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./">
        <span class="logo" aria-hidden="true"></span>
        <span>Sound Capsule</span>
      </a>
      <nav class="views" aria-label="Views">
        <button type="button" data-view="capsule" class="active">Capsule</button>
        <button type="button" data-view="history">History</button>
      </nav>
      <div id="account" class="account"></div>
    </header>

    <main id="main" class="main"></main>

    <footer class="footer">
      <p>
        Unofficial fan project. Not affiliated with Spotify. Everything runs in your browser; your history and tokens never
        leave this device.
        <a href="#" data-action="open-settings">Settings</a>
      </p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="share-stage" class="share-stage" aria-hidden="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js" defer></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
